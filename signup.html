<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>판다마켓 회원가입</title>
    <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard"
    />
    <link rel="stylesheet" href="css/singup.css">
    <link rel="icon" href="icon/icon-panda.png">
  </head>
  
  <body>
    <div class="login-container">
      <div class="logo">
        <a href="index.html">
          <img src="images/logo.png" alt="판다마켓 로고">
        </a>
      </div>

      <form class="login-form">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일을 입력해주세요" required>

        <label for="name">닉네임</label>
        <input type="text" id="name" placeholder="닉네임을 입력해주세요" required>

        <label for="password">비밀번호</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="비밀번호를 입력해주세요" required>
          <img src="./images/close-eye.png" class="toggle-password">
        </div>

        <label for="password-check">비밀번호 확인</label>
        <div class="password-wrapper-second">
          <input type="password" id="password-check" placeholder="비밀번호를 다시 한 번 입력해주세요" required>
          <img src="./images/close-eye.png" class="toggle-password-second">
        </div>

        <button type="submit" class="singup-button">회원가입</button>
      </form>

      <div class="social-login">
          <p>간편 로그인하기</p>
        <div class="social-button">
          <button class="social-btn google-btn">
            <img src="images/google-login.png" alt="google logo" />
          </button>
            <button class="social-btn kakao-btn">
            <img src="images/kakao-login.png" alt="kakao logo" />
          </button>
        </div>
      </div>

      <p class="signup-text">
        이미 회원이신가요? <a href="login.html">로그인</a>
      </p>
    </div>
    <script src="js/form.js"></script>
    <script src="js/signup.js"></script>
  </body>
</html>
