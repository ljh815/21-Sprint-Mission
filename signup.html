<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>판다마켓 회원가입</title>
    <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard"
    />
    <link rel="stylesheet" href="css/singup.css">
    <link rel="icon" href="icon/icon-panda.png">
  </head>
  
  <body>
    <div class="login-container">
      <div class="logo">
        <a href="index.html">
          <img src="images/logo.png" alt="판다마켓 로고">
        </a>
      </div>

      <form class="login-form">
        <label for="email">이메일</label>
        <input type="email" id="email" required>

        <label for="name">닉네임</label>
        <input type="text" id="name" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" required>

        <label for="password-check">비밀번호 확인</label>
        <input type="text" id="password-check" required>

        <button type="submit" class="login-button">회원가입</button>
      </form>

      <p class="signup-text">
        이미 회원이신가요? <a href="signup.html">로그인</a>
      </p>
    </div>
  </body>
</html>
