<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>판다마켓</title>
    <link rel="stylesheet" href="css/style.css">
    <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard"
    />
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" href="icon/icon-panda.png">
  </head>

  <body>

    <header>
    <div class="logo">
      <picture>
         <source media="(min-width: 375px) and (max-width: 767px)" srcset="images/mobile-logo.png"> 
         <img class="icon" src="images/global-logo.png" alt="판다 로고"> 
      </picture>
      <a href="login.html" id="login-button" class="button">로그인</a>
    </div>
    </header>

    <main>

      <section id="watch" class="bn">
        <div class="text">
        <h2>  
          일상의 모든 물건을<br>
          거래해 보세요
        </h2>
        <a href="watch.html" class="button watch-button">구경하러 가기</a>
        </div>
      </section>

      <section id="mains" class="text">
        <div class="main">
          <img src="images/mains-hot-img.png" alt="핫 아이템">
          <div class="content">
            <h2 class="label">Hot item</h2>
            <h2 class="h2-context">
              인기 상품을<br>
              확인해 보세요
            </h2>
            <p class="label-context">
              가장 HOT한 중고거래 물품을<br>
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <div class="main second">
          <div class="content">
            <h2 class="label">Search</h2>
            <h2 class="h2-context">
              구매를 원하는<br>
              상품을 검색하세요
            </h2>
            <p class="label-context">
              구매하고 싶은 물품은 검색해서<br>
              쉽게 찾아보세요
            </p>
        </div>
          <img src="images/mains-search-img.png" alt="검색">
        </div>
        <div class="main">
          <img src="images/mains-register-img.png" alt="판매">
          <div class="content">
            <h2 class="label">Register</h2>
            <h2 class="h2-context">
              판매를 원하는<br>
              상품을 등록하세요
            </h2>
            <p class="label-context">
              어떤 물건이든 판매하고 싶은 상품을<br>
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section id="trust" class="bn">
        <div class="text">
          <h2>  
            믿을수 있는<br>
            판다마켓 중고 거래
          </h2>
        </div>
      </section>
       
    </main>

    <footer>
      <div class="footer-copyright">
        <p>@codeit - 2024</p>
      <div class="privacy">
        <a href="policy.html">Privacy Policy</a>
        <a href="FAQ.html">FAQ</a>
      </div>
        <div class="footer-snslink">
          <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
          <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
          <a href="https://www.youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
          <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>  
      </div>
    </footer>

  </body>
</html>
